server {
    listen 80;
    listen [::]:80;
    server_name eduri.ru;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Do not expose authentication over plaintext while the first
    # certificate is being issued.
    location / {
        return 503;
    }
}
