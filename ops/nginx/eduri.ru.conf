map $http_upgrade $eduri_connection_upgrade {
    default upgrade;
    ''      close;
}

# Python worker sources are fetched and validated by the application before an
# opaque-origin sandbox creates a Blob Worker. Their direct-response policy is
# still fail-closed defense in depth. $uri deliberately excludes the protocol
# query string used for cache/version negotiation.
map $uri $eduri_content_security_policy {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' blob: 'sha256-qtcfi13uE8qIguKGtjdNVjdG6r1tYyGItQ18qk+LMDw=' 'sha256-n1yprbulB/x592q6HD8xxYLtXL36qSEIK7bJBpXymR8=' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss://eduri.ru; frame-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; media-src 'self' data: blob:; manifest-src 'self'; upgrade-insecure-requests";
    /python-runner.worker.js "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src https://eduri.ru/vendor/pyodide/0.27.5/pyodide.js https://eduri.ru/vendor/pyodide/0.27.5/pyodide.asm.js 'wasm-unsafe-eval'; style-src 'none'; img-src 'none'; font-src 'none'; connect-src 'none'; frame-src 'none'; worker-src 'none'; child-src 'none'; media-src 'none'; manifest-src 'none'; webrtc 'block'";
    /python-terminal.worker.js "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src https://eduri.ru/vendor/pyodide/0.27.5/pyodide.js https://eduri.ru/vendor/pyodide/0.27.5/pyodide.asm.js 'wasm-unsafe-eval'; style-src 'none'; img-src 'none'; font-src 'none'; connect-src 'none'; frame-src 'none'; worker-src 'none'; child-src 'none'; media-src 'none'; manifest-src 'none'; webrtc 'block'";
}

# Keep connection and request budgets independent so one realtime transport
# cannot consume another transport's allowance for users behind the same NAT.
limit_conn_zone $binary_remote_addr zone=eduri_board_connections:1m;
limit_conn_zone $binary_remote_addr zone=eduri_socketio_connections:1m;
limit_conn_zone $binary_remote_addr zone=eduri_guest_connections:1m;
limit_conn_zone $binary_remote_addr zone=eduri_livekit_connections:1m;
limit_req_zone $binary_remote_addr zone=eduri_board_handshakes:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=eduri_socketio_requests:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=eduri_guest_requests:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=eduri_livekit_handshakes:1m rate=5r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name eduri.ru;

    server_tokens off;

    if ($host != eduri.ru) {
        return 444;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Do not disclose bearer capabilities even when a client first reaches the
    # HTTP redirect endpoint before learning the HSTS policy.
    location ~ "^/room/[A-Za-z0-9_-]{43}(?:/|$)" {
        access_log off;
        return 301 https://eduri.ru$request_uri;
    }

    location ~ "^/api/guest/rooms/[A-Za-z0-9_-]{43}(?:/|$)" {
        access_log off;
        return 301 https://eduri.ru$request_uri;
    }

    location / {
        return 301 https://eduri.ru$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name eduri.ru;

    server_tokens off;
    if ($host != eduri.ru) {
        return 444;
    }
    if (-f /etc/eduri/maintenance) {
        return 503;
    }
    client_max_body_size 32m;
    limit_conn_status 429;
    limit_req_status 429;

    ssl_certificate /etc/letsencrypt/live/eduri.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eduri.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/eduri.ru/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:EDURI_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self), cross-origin-isolated=*, geolocation=(), payment=(), usb=()" always;

    # Monaco and pinned Pyodide assets are served by Eduri. Exact hashes
    # authorize only the pre-paint theme bootstrap and the checked-in opaque
    # Python host bootstrap. Blob scripts/workers are required because the
    # opaque sandbox executes only source that the parent fetched and verified;
    # inline styles and WASM compilation remain explicit requirements.
    add_header Content-Security-Policy "$eduri_content_security_policy" always;

    # Nginx is the canonical security-header layer. Hide every Helmet header
    # that Express may emit before adding the exact edge policy above. COOP and
    # COEP keep both the application and its opaque Python sandbox
    # cross-origin isolated. Pyodide stdin SharedArrayBuffers are created only
    # inside that sandbox.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Origin-Agent-Cluster;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-DNS-Prefetch-Control;
    proxy_hide_header X-Download-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Powered-By;

    location ^~ /socket.io/ {
        limit_conn eduri_socketio_connections 16;
        limit_req zone=eduri_socketio_requests burst=20 nodelay;

        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $eduri_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    location = /api/board-v2/sync {
        limit_conn eduri_board_connections 8;
        limit_req zone=eduri_board_handshakes burst=10 nodelay;

        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $eduri_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # A guest share key is a bearer capability. Requests containing the exact
    # 43-character key must never enter the access log.
    location ~ "^/room/[A-Za-z0-9_-]{43}(?:/|$)" {
        access_log off;
        error_log /var/log/nginx/error.log crit;
        limit_conn eduri_guest_connections 24;
        limit_req zone=eduri_guest_requests burst=20 nodelay;

        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ "^/api/guest/rooms/[A-Za-z0-9_-]{43}(?:/|$)" {
        access_log off;
        error_log /var/log/nginx/error.log crit;
        limit_conn eduri_guest_connections 24;
        limit_req zone=eduri_guest_requests burst=20 nodelay;

        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Creation and invalid/non-capability guest API paths remain observable.
    # Regex locations above take precedence for every valid bearer key.
    location /api/guest/rooms {
        limit_conn eduri_guest_connections 24;
        limit_req zone=eduri_guest_requests burst=20 nodelay;

        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # The signaling prefix also strips /livekit. Deny its nested Twirp spelling
    # before the broader proxy, otherwise it would become /twirp upstream.
    location ^~ /livekit/twirp {
        access_log off;
        error_log /var/log/nginx/error.log crit;
        return 404;
    }

    # Strip the /livekit prefix before forwarding signaling to the local SFU.
    location ^~ /livekit/ {
        # LiveKit WebSocket handshakes carry the room JWT in access_token.
        access_log off;
        error_log /var/log/nginx/error.log crit;
        limit_conn eduri_livekit_connections 16;
        limit_req zone=eduri_livekit_handshakes burst=10 nodelay;

        proxy_pass http://127.0.0.1:7880/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $eduri_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Management RPCs use the private Compose gateway and are never exposed on
    # the public origin. Keep an exact denial ahead of the SPA fallback.
    location ^~ /twirp {
        access_log off;
        error_log /var/log/nginx/error.log crit;
        return 404;
    }

    # The retired JavaScript runner must not fall through to the SPA shell.
    location = /javascript-runner.worker.js {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
